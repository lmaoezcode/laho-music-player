# LaHo CI — unit tests + debug build for the LaHo branches.
#
# Based on upstream Rhythm's android.yml. Removed for this fork (see commit message):
# the lint job, the release build, and every secret (PRIVATE_PROPERTIES,
# APPLE_MUSIC_FALLBACK_TOKEN). nightly.yml, release.yml and weblate-sync.yml were
# deleted because they sign with upstream keys, publish GitHub releases, post to
# Telegram/Discord, or push/merge translations on upstream's Weblate.
name: LaHo CI

on:
  push:
    branches: [ "laho", "spike/**", "claude/**" ]
  pull_request:
    branches: [ "laho", "spike/**", "claude/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laho-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Must match ndkVersion in third_party/decent-usb-audio/usb-audio-driver/build.gradle.kts
  # and AGP's default CMake.
  NDK_VERSION: "29.0.14206865"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # third_party/flac (xiph/flac 1.5.0) is needed by the native USB driver.
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v5

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # app/src/debug/google-services.json is git-ignored: the build only warns
      # (missingGoogleServicesStrategy = WARN) and the online assistant is disabled.
      - name: Unit tests (vn.laho.*) + assemble githubDebug
        run: |
          EXTRA_ARGS=()
          if [ ! -d app/src/test/java/vn/laho ]; then
            # Branches without LaHo tests yet (e.g. bare laho): don't fail on an empty filter.
            echo "::notice::No LaHo unit tests on this branch; the test filter may match nothing."
            cat > "$RUNNER_TEMP/no-match-ok.gradle" <<'EOF'
          allprojects {
              tasks.withType(Test).configureEach { filter.failOnNoMatchingTests = false }
          }
          EOF
            EXTRA_ARGS+=(--init-script "$RUNNER_TEMP/no-match-ok.gradle")
          fi
          ./gradlew "${EXTRA_ARGS[@]}" \
            testGithubDebugUnitTest --tests "vn.laho.musicplayer.*" \
            assembleGithubDebug

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testGithubDebugUnitTest/
            app/build/test-results/testGithubDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload arm64 debug APK
        uses: actions/upload-artifact@v7
        with:
          name: laho-githubDebug-arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/github/debug/*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
